[workspace]
members = [
    "crates/otterdive-core",
    "crates/otterdive-app",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ron159/OtterDive"

[workspace.dependencies]
otterdive-core = { path = "crates/otterdive-core" }
tauri = "2.12.3"
tauri-build = "2.7.2"
tauri-plugin-window-state = "2.4.1"
rfd = "0.17.2"
encoding_rs = "0.8.35"
fancy-regex = "0.14.0"
regex = "1.12.4"
walkdir = "2.5.0"
memmap2 = "0.9.11"
quick-xml = "0.41.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
rusqlite = { version = "0.40.1", features = ["bundled"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
winreg = "0.55.0"
