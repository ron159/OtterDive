[package]
name = "otterdive-app"
version = "0.8.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "otterdive"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
otterdive-core.workspace = true
tauri = { workspace = true, features = ["protocol-asset"] }
rfd.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
encoding_rs.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
rusqlite.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-updater.workspace = true
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
trash = "5.2.9"
url = "2.5.8"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[build-dependencies]
tauri-build.workspace = true
