[package]
name = "otterdive-app"
version = "0.7.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[[bin]]
name = "otterdive"
path = "src/main.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
otterdive-core.workspace = true
tauri = { workspace = true, features = ["protocol-asset"] }
rfd.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "0.22.1"
encoding_rs.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring"] }
rusqlite.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-window-state.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-updater.workspace = true

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[build-dependencies]
tauri-build.workspace = true
